name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The README is a build artifact. Regenerate it and fail if the committed
      # page or panels drifted from what the repo would produce.
      - run: npm run readme
      - run: git diff --exit-code -- README.md assets
