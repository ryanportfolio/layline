@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.row{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.track{stroke-dashoffset:0}}
</style>

