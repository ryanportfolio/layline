<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 508" width="880" height="508" role="img" aria-label="One Debrief tool call: the question &quot;Who won the start&quot;, the status line the stream prints while start_report runs, and the rows it returns. JPN 18 crossed 0.15 seconds after the gun from 0.6 m short of the line, nearer the boat end; NZL 7 crossed 0.17 seconds after the gun from 0.6 m short of the line, nearer the pin end; FRA 12 crossed 0.23 seconds after the gun from 1 m short of the line, nearer the boat end; USA 4 crossed 0.3 seconds after the gun from 1.2 m short of the line, nearer the boat end; GBR 21 crossed 0.36 seconds after the gun from 1.5 m short of the line, nearer the pin end; AUS 33 crossed 0.52 seconds after the gun from 1.9 m short of the line, nearer the pin end.">
