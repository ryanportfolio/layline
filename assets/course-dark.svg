<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="The Layline racecourse drawn from its own seed: six boat tracks beat to the windward mark inside its laylines and run back to the finish, with the finish order 1 JPN 18 0:50, 2 FRA 12 0:53, 3 NZL 7 0:54, 4 GBR 21 0:56, 5 USA 4 0:57, 6 AUS 33 0:58.">
