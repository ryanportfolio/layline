<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="The Layline racecourse drawn from its own seed: six boat tracks beat to the windward mark inside its laylines and run back to the finish, with the finish order 1 USA 4 0:51, 2 JPN 18 0:52, 3 GBR 21 0:55, 4 NZL 7 0:56, 5 AUS 33 0:57, 6 FRA 12 0:57.">
